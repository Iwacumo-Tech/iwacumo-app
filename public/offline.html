<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#FFD700" />
  <title>You're offline — Iwacumo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #FAF9F6;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding: 48px 16px;
      -webkit-text-size-adjust: 100%;
    }
    .wrap { max-width: 28rem; margin: 0 auto; }
    .card {
      background: #fff;
      border: 4px solid #000;
      box-shadow: 6px 6px 0 #000;
      padding: 32px;
      text-align: center;
    }
    .logo {
      width: 80px; height: 80px;
      border: 2px solid #000;
      border-radius: 16px;
      overflow: hidden;
      margin: 0 auto 24px;
      display: block;
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    h1 {
      font-size: 28px; font-weight: 900; font-style: italic;
      text-transform: uppercase; letter-spacing: -0.5px;
      margin-bottom: 12px;
    }
    h1 .dot { color: #FFD700; }
    .row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; color: #B45309; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
    p.sub { font-size: 14px; color: #666; font-weight: 500; line-height: 1.5; }
    .actions { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      height: 56px; padding: 0 32px;
      font-size: 14px; font-weight: 900; font-style: italic; text-transform: uppercase;
      letter-spacing: 2px; text-decoration: none; cursor: pointer;
      border: 2px solid #000; border-radius: 0;
      font-family: inherit;
    }
    .btn-primary { background: #000; color: #fff; }
    .btn-secondary { background: #fff; color: #000; font-size: 12px; height: 48px; }
    .tip { margin-top: 24px; text-align: center; font-size: 11px; color: #999; font-weight: 500; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <span class="logo"><img src="/icons/v2/icon-192x192.png" alt="Iwacumo" width="80" height="80" /></span>
      <div class="row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 5-2.91"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        <span>You&apos;re offline</span>
      </div>
      <h1>No connection<span class="dot">.</span></h1>
      <p class="sub">This page needs the internet. Reconnect to continue browsing &mdash; your downloaded books are still available.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/app/books">Go to Library</a>
        <button class="btn btn-secondary" type="button" onclick="window.location.reload()">Try Again</button>
      </div>
    </div>
    <p class="tip">Tip: download books while online to read them anywhere.</p>
  </div>
</body>
</html>
